name: Build APK & verifikasi server Linux

on:
  push:
    branches: [ main ]
    paths:
      - "android/**"
      - "server/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
  workflow_dispatch:

jobs:
  # ============================================================
  # Verifikasi server sebelum APK dibangun. Runner-nya Ubuntu,
  # jadi ini bukan simulasi: kode yang diuji adalah kode yang
  # nanti benar-benar jalan di PC pengguna.
  # ============================================================
  verify-server:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # API process_request berbeda antara websockets <14 dan >=14.
        # Server harus jalan di keduanya — diuji nyata, bukan diasumsikan.
        websockets: [ "12.0", "13.1", "15.0.1" ]
    name: verify-server (websockets ${{ matrix.websockets }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pasang dependensi sistem
        run: |
          sudo apt-get update
          # Xvfb: server X sungguhan untuk menguji backend input.
          # xdotool: backend cadangan terakhir, ikut diuji keberadaannya.
          sudo apt-get install -y --no-install-recommends xvfb xdotool

      - name: Pasang dependensi Python
        run: |
          pip install "websockets==${{ matrix.websockets }}" cryptography \
                      evdev python-xlib

      - name: Gerbang keamanan test (wajib lulus dulu)
        working-directory: server
        run: |
          # test_safety.py membuktikan safe_harness memblokir aksi sistem-nyata
          # tanpa CLAUDEPAD_ALLOW_REAL=1 dan mode --sandbox mensimulasikannya.
          # Dijalankan PALING AWAL supaya pelanggaran keamanan menggagalkan CI
          # sebelum suite lain sempat menyentuh sistem.
          python tests/test_safety.py

      - name: Uji peta tombol
        working-directory: server
        run: python tests/test_keymaps.py

      - name: Uji protokol end-to-end
        working-directory: server
        run: python tests/test_e2e.py

      - name: Uji backend input di X11 sungguhan
        working-directory: server
        run: python tests/test_input_x11.py

      - name: Uji server jalan tanpa dependensi opsional
        working-directory: server
        run: |
          # evdev, xlib, keyring, pystray semuanya opsional. Server WAJIB
          # tetap hidup tanpa mereka — hanya turun ke backend seadanya.
          pip uninstall -y evdev python-xlib
          python tests/test_e2e.py

  # ============================================================
  # Bangun APK yang DITANDATANGANI, lalu terbitkan sebagai rilis
  # semver (vX.Y.Z). Versi APK wajib cocok dengan server, kalau
  # tidak server menolak koneksi dan pengguna baru sadar di HP.
  # ============================================================
  build-apk:
    needs: verify-server
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"

      - name: Baca versi & pastikan APK diterima server
        id: ver
        run: |
          APK=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts)
          SRV=$(grep -oP 'APP_VERSION\s*=\s*"\K[^"]+' server/pc_server.py)
          COMPAT=$(grep -oP 'COMPATIBLE_APP_VERSIONS\s*=\s*\{\K[^}]+' server/pc_server.py)
          echo "versi APK        : $APK"
          echo "versi server     : $SRV"
          echo "versi diterima   : $COMPAT"
          if [ "$APK" != "$SRV" ]; then
            echo "::error::Versi APK ($APK) tidak sama dengan server ($SRV) - naikkan keduanya"
            exit 1
          fi
          if ! echo "$COMPAT" | grep -q "\"$APK\""; then
            echo "::error::Versi APK ($APK) tidak ada di COMPATIBLE_APP_VERSIONS"
            exit 1
          fi
          # Normalisasi ke semver (3 bagian) supaya tag rilis rapi & konsisten.
          IFS='.' read -ra P <<< "$APK"
          while [ ${#P[@]} -lt 3 ]; do P+=("0"); done
          SEMVER="${P[0]}.${P[1]}.${P[2]}"
          echo "version_raw=$APK" >> "$GITHUB_OUTPUT"
          echo "semver=$SEMVER"     >> "$GITHUB_OUTPUT"
          echo "tag=v$SEMVER"       >> "$GITHUB_OUTPUT"

      - name: Unduh JetBrains Mono
        continue-on-error: true
        run: |
          mkdir -p android/app/src/main/res/font
          curl -fsSL --retry 3 -o android/app/src/main/res/font/jetbrains_mono.ttf \
            "https://raw.githubusercontent.com/JetBrains/JetBrainsMono/v2.304/fonts/ttf/JetBrainsMono-Regular.ttf" \
            && echo "Font berhasil diunduh" \
            || echo "Font gagal diunduh - aplikasi akan memakai monospace bawaan"

      - name: Build APK (release, unsigned)
        id: build
        working-directory: android
        run: |
          set +e
          # Tanpa signingConfig di build.gradle.kts, AGP menghasilkan APK
          # UNSIGNED (app-release-unsigned.apk). Penandatanganan dilakukan
          # sepenuhnya oleh langkah berikutnya, sehingga cukup sekali tanda
          # tangan dan tidak ada risiko double-sign.
          gradle assembleRelease --no-daemon --stacktrace
          set -e
          # CWD = android/, jadi output ada di app/build/outputs/... di dalamnya.
          APK_REL=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK_REL" ]; then
            echo "::error::assembleRelease tidak menghasilkan APK"
            exit 1
          fi
          # Tulis sebagai path relatif ke root repo agar langkah berikutnya
          # (yang berjalan dari root) bisa menggunakannya.
          echo "apk_path=android/$APK_REL" >> "$GITHUB_OUTPUT"

      - name: Tanda tangani APK
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
          STORE_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner tidak ditemukan di \$ANDROID_HOME/build-tools"
            exit 1
          fi
          APK="${{ steps.build.outputs.apk_path }}"

          if [ -n "$KEYSTORE_B64" ]; then
            # Keystore produksi dari rahasia repo - APK resmi milikmu.
            echo "$KEYSTORE_B64" | base64 -d > /tmp/claudepad.jks
            KS=/tmp/claudepad.jks
            ALIAS="$KEY_ALIAS"; SP="$STORE_PASS"; KP="$KEY_PASS"
            echo "Menandatangani dengan keystore produksi (rahasia repo)."
          else
            # Tanpa rahasia: pakai debug keystore CI agar APK tetap terpasang.
            # (Gradle menciptakannya saat build; kalau belum ada, buat sekarang.)
            KS="$HOME/.android/debug.keystore"
            if [ ! -f "$KS" ]; then
              mkdir -p "$HOME/.android"
              keytool -genkeypair -v -keystore "$KS" -alias androiddebugkey \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass android -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            ALIAS=androiddebugkey; SP=android; KP=android
            echo "Tidak ada rahasia keystore - menandatangani dengan debug keystore CI."
          fi
          # APK dari Gradle belum ditandatangani, jadi cukup sekali tanda tangan.
          "$APKSIGNER" sign --ks "$KS" --ks-key-alias "$ALIAS" \
            --ks-pass pass:"$SP" --key-pass pass:"$KP" "$APK"
          echo "apk_signed=$APK" >> "$GITHUB_OUTPUT"

      - name: Siapkan aset rilis
        id: assets
        run: |
          SEM="${{ steps.ver.outputs.semver }}"
          SIGNED="${{ steps.sign.outputs.apk_signed }}"
          APK_NAME="CLAUDEPAD-LINUX-v$SEM.apk"
          cp "$SIGNED" "$APK_NAME"
          tar -czf "CLAUDEPAD-LINUX-server-v$SEM.tar.gz" server
          # Checksum untuk verifikasi integritas unduhan oleh pengguna.
          sha256sum "$APK_NAME" "CLAUDEPAD-LINUX-server-v$SEM.tar.gz" > SHA256SUMS
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "server_name=CLAUDEPAD-LINUX-server-v$SEM.tar.gz" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_NAME" "CLAUDEPAD-LINUX-server-v$SEM.tar.gz" SHA256SUMS

      - name: Ekstrak catatan rilis dari CHANGELOG
        id: notes
        run: |
          V="${{ steps.ver.outputs.version_raw }}"
          # Ambil bagian di bawah "## v<V>" sampai heading berikutnya.
          awk -v v="v$V" '
            /^## / { if (f) exit; if ($0 ~ "^## " v) f=1; next }
            f { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            printf 'Build otomatis dari commit %s.\n\nLihat CHANGELOG.md untuk daftar perubahan.\n' \
              "$GITHUB_SHA" > /tmp/notes.md
          fi
          echo "notes_file=/tmp/notes.md" >> "$GITHUB_OUTPUT"

      - name: Upload artefak (cadangan bila rilis gagal)
        uses: actions/upload-artifact@v4
        with:
          name: CLAUDEPAD-LINUX-v${{ steps.ver.outputs.semver }}
          path: |
            CLAUDEPAD-LINUX-v*.apk
            CLAUDEPAD-LINUX-server-v*.tar.gz
            SHA256SUMS

      - name: Publikasikan rilis semver
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          SEM: ${{ steps.ver.outputs.semver }}
        run: |
          APK="CLAUDEPAD-LINUX-v$SEM.apk"
          SRV="CLAUDEPAD-LINUX-server-v$SEM.tar.gz"
          NOTES="$(cat /tmp/notes.md)"
          # API release GitHub sesekali balas "No server is currently available".
          # Itu gangguan sementara di sisi mereka - coba ulang dengan jeda menaik.
          for i in 1 2 3 4 5; do
            echo "--- percobaan publikasi $i ---"
            if gh release view "$TAG" >/dev/null 2>&1; then
              if gh release edit "$TAG" --title "CLAUDEPAD LINUX v$SEM" --notes "$NOTES" \
                 && gh release upload "$TAG" "$APK" "$SRV" SHA256SUMS --clobber; then
                echo "Release $TAG diperbarui"; exit 0
              fi
            else
              if gh release create "$TAG" "$APK" "$SRV" SHA256SUMS \
                   --title "CLAUDEPAD LINUX v$SEM" --notes "$NOTES"; then
                echo "Release $TAG dibuat"; exit 0
              fi
            fi
            SLEEP=$((i * 20))
            echo "gagal - menunggu ${SLEEP}s lalu mencoba lagi"
            sleep $SLEEP
          done
          echo "::error::Gagal mempublikasikan release setelah 5 percobaan."
          echo "APK tetap tersedia sebagai artefak build di halaman run ini."
          exit 1

      - name: Hapus rilis 'latest' usang (migrasi ke semver)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Repo ini dulu memakai tag 'latest' yang mutable. Setelah rilis
          # semver aktif, tag itu dihapus agar tidak mengganggu. Aman dijalankan
          # berulang - perintah di bawah gagal diam-diam bila sudah tiada.
          gh release delete latest --yes 2>/dev/null || true
          git push --delete origin latest 2>/dev/null || true
